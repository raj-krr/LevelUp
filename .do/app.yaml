name: levelup
services:
  - name: web
    environment_slug: python
    github:
      repo: your-username/levelup
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: gunicorn --worker-tmp-dir /dev/shm --config gunicorn_config.py app:app
    health_check:
      http_path: /healthz
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMMA_MODEL
        scope: RUN_TIME
        value: gemma-4-26b-a4b-it
      - key: GEMMA_VERIFY_MODEL
        scope: RUN_TIME
        value: gemma-4-31b-it

